name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-staging-tools:
    name: Backend and staging tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: thaiculture_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U ci -d thaiculture_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run staging tooling tests
        run: python -m unittest discover -s scripts/staging -p 'test_staging_tools.py' -v

      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/tests scripts/staging

      - name: Check diff whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          git diff --check
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$PUSH_BEFORE_SHA...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:55441/thaiculture_test
          TCT_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:55441/thaiculture_test
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  frontend:
    name: Frontend tests, build, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
